name: JobFinder Unit Tests

on:
  push:
    branches:
      - master
    paths:
      - "auto_jobfinder_cloud.py"
      - "cloud_runner.py"
      - "decision_audit.py"
      - "tools/export_decision_audit.py"
      - ".github/workflows/jobfinder-decision-audit-export.yml"
      - "telegram_control.py"
      - "tests/**"
      - "requirements-cloud.txt"
      - ".github/workflows/jobfinder-unit-tests.yml"
  pull_request:
    paths:
      - "auto_jobfinder_cloud.py"
      - "cloud_runner.py"
      - "decision_audit.py"
      - "tools/export_decision_audit.py"
      - "tests/**"
      - "requirements-cloud.txt"
      - ".github/workflows/jobfinder-unit-tests.yml"
      - ".github/workflows/jobfinder-cloud.yml"
      - ".github/workflows/jobfinder-decision-audit-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-cloud.txt
      - name: Compile Python modules
        run: python -m py_compile auto_jobfinder_cloud.py cloud_runner.py decision_audit.py tools/export_decision_audit.py telegram_control.py tests/test_decision_audit.py tests/test_telegram_control.py
      - name: Run unit tests without external credentials
        run: python -m unittest discover -s tests -v
