name: JobFinder Cloud Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobfinder-cloud-monitor
  queue: max
  cancel-in-progress: false

jobs:
  monitor-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest master state
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements-cloud.txt; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency installation failed; retrying (${attempt}/3)." >&2
              sleep 5
            fi
          done
          echo "Dependency installation failed after 3 attempts." >&2
          exit 1

      - name: Poll Telegram, analyze offers, and apply when eligible
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite' }}
          JOBFINDER_AI_MIN_REQUEST_INTERVAL_SECONDS: ${{ vars.JOBFINDER_AI_MIN_REQUEST_INTERVAL_SECONDS || '3' }}
          JOBFINDER_AI_OUTAGE_RETRY_SECONDS: ${{ vars.JOBFINDER_AI_OUTAGE_RETRY_SECONDS || '300' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOBFINDER_FERNET_KEY: ${{ secrets.JOBFINDER_FERNET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          TELEGRAM_WEBHOOK_MODE: ${{ secrets.TELEGRAM_WEBHOOK_URL != '' && '1' || '' }}
        run: python cloud_runner.py

      - name: Commit encrypted state only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_private/state.enc
          if git diff --cached --quiet; then
            echo "No encrypted state changes to save."
          else
            git commit -m "Update encrypted JobFinder state"
            for attempt in 1 2 3; do
              git fetch origin +refs/heads/master:refs/remotes/origin/master
              if ! git rebase origin/master; then
                git rebase --abort || true
                echo "State checkpoint rebase conflicted; refusing to overwrite remote state." >&2
                exit 1
              fi
              if git push origin HEAD:master; then
                echo "Encrypted JobFinder state saved."
                exit 0
              fi
              echo "Remote master moved during state checkpoint push; retrying (${attempt}/3)." >&2
              sleep 2
            done
            echo "Unable to save encrypted state checkpoint after 3 attempts." >&2
            exit 1
          fi
