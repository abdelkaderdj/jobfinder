name: JobFinder Telegram Webhook Event

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: Telegram event type
        required: true
        type: choice
        options:
          - command
          - callback
      command:
        description: Validated Telegram command
        required: false
        type: string
      action:
        description: Validated callback action
        required: false
        type: string
      pending_id:
        description: Pending review ID or test action
        required: false
        type: string
      chat_id:
        description: Validated private chat ID
        required: true
        type: string
      user_id:
        description: Validated Telegram sender ID
        required: true
        type: string
      message_id:
        description: Original Telegram message ID for callback editing
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: jobfinder-cloud-monitor
  queue: max
  cancel-in-progress: false

jobs:
  process-telegram-event:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out latest master state
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-cloud.txt

      - name: Process one validated Telegram event only
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          JOBFINDER_AI_MIN_REQUEST_INTERVAL_SECONDS: ${{ vars.JOBFINDER_AI_MIN_REQUEST_INTERVAL_SECONDS || '3' }}
          JOBFINDER_AI_OUTAGE_RETRY_SECONDS: ${{ vars.JOBFINDER_AI_OUTAGE_RETRY_SECONDS || '300' }}
          JOBFINDER_AI_CONFIG_RETRY_SECONDS: ${{ vars.JOBFINDER_AI_CONFIG_RETRY_SECONDS || '900' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOBFINDER_FERNET_KEY: ${{ secrets.JOBFINDER_FERNET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          TELEGRAM_WEBHOOK_MODE: "1"
          JOBFINDER_TELEGRAM_WEBHOOK_EVENT: "1"
          JOBFINDER_TELEGRAM_UPDATE_TYPE: ${{ inputs.update_type }}
          JOBFINDER_TELEGRAM_COMMAND: ${{ inputs.command }}
          JOBFINDER_TELEGRAM_ACTION: ${{ inputs.action }}
          JOBFINDER_TELEGRAM_PENDING_ID: ${{ inputs.pending_id }}
          JOBFINDER_TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
          JOBFINDER_TELEGRAM_USER_ID: ${{ inputs.user_id }}
          JOBFINDER_TELEGRAM_MESSAGE_ID: ${{ inputs.message_id }}
        run: python cloud_runner.py

      - name: Commit encrypted state only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_private/state.enc
          if git diff --cached --quiet; then
            echo "No encrypted state changes to save."
          else
            git commit -m "Update encrypted JobFinder state after Telegram event"
            for attempt in 1 2 3; do
              git fetch origin +refs/heads/master:refs/remotes/origin/master
              if ! git rebase origin/master; then
                git rebase --abort || true
                echo "State checkpoint rebase conflicted; refusing to overwrite remote state." >&2
                exit 1
              fi
              if git push origin HEAD:master; then
                echo "Encrypted JobFinder state saved."
                exit 0
              fi
              echo "Remote master moved during state checkpoint push; retrying (${attempt}/3)." >&2
              sleep 2
            done
            echo "Unable to save encrypted state checkpoint after 3 attempts." >&2
            exit 1
          fi
