name: JobFinder AI Provider Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "auto_jobfinder_cloud.py"
      - "tools/ai_provider_smoke_test.py"
      - "requirements-cloud.txt"
      - ".github/workflows/jobfinder-cloud.yml"
      - ".github/workflows/jobfinder-ai-provider-smoke-test.yml"

permissions:
  contents: read

concurrency:
  group: jobfinder-ai-provider-smoke-test
  cancel-in-progress: false

jobs:
  provider-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-cloud.txt
      - name: Compile smoke test
        run: python -m py_compile auto_jobfinder_cloud.py tools/ai_provider_smoke_test.py
      - name: Test live provider routing without sending applications
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite' }}
        run: python tools/ai_provider_smoke_test.py
