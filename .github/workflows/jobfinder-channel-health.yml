name: JobFinder Telegram Channel Readability Audit

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "tools/check_telegram_channels.py"
      - ".github/workflows/jobfinder-channel-health.yml"

permissions:
  contents: read

concurrency:
  group: jobfinder-channel-health-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cloud dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements-cloud.txt; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency installation failed; retrying (${attempt}/3)." >&2
              sleep 5
            fi
          done
          echo "Dependency installation failed after 3 attempts." >&2
          exit 1

      - name: Compile diagnostic files
        run: python -m py_compile cloud_runner.py tools/check_telegram_channels.py

      - name: Check access and backlog for all configured channels (read-only)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          JOBFINDER_FERNET_KEY: ${{ secrets.JOBFINDER_FERNET_KEY }}
        run: python tools/check_telegram_channels.py
