name: JobFinder Encrypted-Profile AI Evaluation

on:
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Number of labelled cases: 1 for a targeted check, 3 for a batch, or 9 for all cases"
        required: true
        type: choice
        default: "9"
        options:
          - "1"
          - "3"
          - "9"
      start_case:
        description: "First case to evaluate (choose 4 with max_cases=1 to retest the evidence fix)"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"
          - "9"

permissions:
  contents: read

# Reuse the production provider lock so evaluation does not compete with the live monitor.
concurrency:
  group: jobfinder-cloud-monitor
  queue: max
  cancel-in-progress: false

jobs:
  encrypted-profile-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install cloud dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements-cloud.txt

      - name: Compile evaluator
        run: python -m py_compile tools/evaluate_ai_quality.py tools/evaluate_encrypted_profile.py

      - name: Run labelled evaluation using the encrypted candidate profile
        env:
          JOBFINDER_FERNET_KEY: ${{ secrets.JOBFINDER_FERNET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite' }}
          JOBFINDER_AI_MIN_REQUEST_INTERVAL_SECONDS: ${{ vars.JOBFINDER_AI_MIN_REQUEST_INTERVAL_SECONDS || '3' }}
          JOBFINDER_AI_OUTAGE_RETRY_SECONDS: ${{ vars.JOBFINDER_AI_OUTAGE_RETRY_SECONDS || '300' }}
          JOBFINDER_AI_CONFIG_RETRY_SECONDS: ${{ vars.JOBFINDER_AI_CONFIG_RETRY_SECONDS || '900' }}
        run: >-
          python tools/evaluate_encrypted_profile.py
          --start-index "${{ inputs.start_case }}"
          --limit "${{ inputs.max_cases }}"
          --strict
