name: JobFinder Last 48h Read-only Audit

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/jobfinder-audit-48h.yml"
      - "tools/audit_recent_posts.py"

permissions:
  contents: read

concurrency:
  group: jobfinder-read-only-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current master
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cloud dependencies
        run: python -m pip install -r requirements-cloud.txt

      - name: Compile audit script
        run: python -m py_compile tools/audit_recent_posts.py

      - name: Audit the last 48 hours without sending applications
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOBFINDER_FERNET_KEY: ${{ secrets.JOBFINDER_FERNET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
        run: python tools/audit_recent_posts.py
