name: JobFinder AI Quality Evaluation (Read-only)

on:
  workflow_dispatch:
    inputs:
      max_cases:
        description: "How many labelled cases to run (uses real AI API quota)"
        required: true
        type: choice
        default: "9"
        options:
          - "3"
          - "6"
          - "9"

permissions:
  contents: read

# Avoid overlapping API quota usage with the production monitor and 48h audit.
concurrency:
  group: jobfinder-cloud-monitor
  queue: max
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install cloud dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements-cloud.txt

      - name: Compile read-only evaluator
        run: python -m py_compile auto_jobfinder_cloud.py jobfinder_candidate_policy.py tools/evaluate_ai_quality.py tools/run_ai_quality_evaluation.py

      - name: Evaluate labelled cases (no Telegram polling, no email, no state writes)
        env:
          JOBFINDER_FERNET_KEY: ${{ secrets.JOBFINDER_FERNET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite' }}
          JOBFINDER_AI_MIN_REQUEST_INTERVAL_SECONDS: ${{ vars.JOBFINDER_AI_MIN_REQUEST_INTERVAL_SECONDS || '3' }}
          JOBFINDER_AI_OUTAGE_RETRY_SECONDS: ${{ vars.JOBFINDER_AI_OUTAGE_RETRY_SECONDS || '300' }}
          JOBFINDER_AI_CONFIG_RETRY_SECONDS: ${{ vars.JOBFINDER_AI_CONFIG_RETRY_SECONDS || '900' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/run_ai_quality_evaluation.py \
            --limit "${{ inputs.max_cases }}" \
            --output artifacts/ai_quality_eval.json

      - name: Upload evaluation report (no source posts or candidate CVs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-ai-quality-eval-${{ github.run_id }}
          path: artifacts/ai_quality_eval.json
          if-no-files-found: warn
          retention-days: 14
