name: JobFinder Historical Decision Audit — Oct 20–21, 2026

on:
  workflow_dispatch:
  # Algeria is UTC+01:00. Run at 00:40 on Oct 22 local time so the full
  # Oct 20 and Oct 21 local calendar days have closed and the last monitor
  # executions have had time to finish. The script is one-off date-guarded.
  schedule:
    - cron: "40 23 21 10 *"

permissions:
  contents: read
  actions: read

concurrency:
  group: jobfinder-historical-audit-oct20-21
  cancel-in-progress: false

jobs:
  historical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only Telegram dependencies
        run: python -m pip install --retries 4 --timeout 60 -r requirements-cloud.txt

      - name: Export dated Telegram posts and match actual monitor decisions
        env:
          TELEGRAM_API_ID: \${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: \${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: \${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: \${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          GITHUB_TOKEN: \${{ github.token }}
          GITHUB_REPOSITORY: \${{ github.repository }}
        run: python tools/export_historical_job_audit.py
