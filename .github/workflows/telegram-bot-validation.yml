name: Telegram Bot Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/telegram-notifications-review

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements-cloud.txt
      - name: Compile Python files
        run: python -m py_compile cloud_runner.py auto_jobfinder_cloud.py telegram_control.py
      - name: Run Telegram control tests
        env:
          GROQ_API_KEY: validation-dummy-key
          GMAIL_APP_PASSWORD: validation-dummy-password
          GMAIL_ADDRESS: validation@example.org
          JOBFINDER_CANDIDATE_PROFILE: validation profile
          JOBFINDER_CANDIDATE_NAME: Validation User
        run: python -m unittest discover -s tests -v
