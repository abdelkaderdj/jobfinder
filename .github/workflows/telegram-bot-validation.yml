name: Telegram Bot Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile cloud_runner.py auto_jobfinder_cloud.py telegram_control.py
      - name: Run Telegram control tests
        run: python -m unittest discover -s tests -v
