name: JobFinder Private Decision Audit Export

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back period for recorded decisions"
        required: true
        type: choice
        default: "2"
        options:
          - "1"
          - "2"
          - "7"
          - "14"
  push:
    paths:
      - ".github/workflows/jobfinder-decision-audit-export.yml"
      - "tools/export_decision_audit.py"

permissions:
  contents: read

# Avoid reading the encrypted ledger while the monitor is writing its checkpoint.
concurrency:
  group: jobfinder-cloud-monitor
  queue: max
  cancel-in-progress: false

jobs:
  export-private-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cloud dependencies
        run: python -m pip install -r requirements-cloud.txt

      - name: Compile private report exporter
        run: python -m py_compile decision_audit.py tools/export_decision_audit.py

      - name: Decrypt only the decision-audit sidecar and send a private report
        env:
          JOBFINDER_FERNET_KEY: ${{ secrets.JOBFINDER_FERNET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          JOBFINDER_AUDIT_DAYS: ${{ inputs.days || '2' }}
          JOBFINDER_AUDIT_EXPORT_PUBLIC_KEY_B64: ""
        run: python tools/export_decision_audit.py

      - name: Upload one-time encrypted private decision audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-private-decision-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/jobfinder-decision-audit.encrypted.json
          if-no-files-found: error
          retention-days: 1

